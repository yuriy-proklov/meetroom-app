<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Переговорка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:#0f0f13; --surface:#1a1a22; --surface2:#22222e; --border:#2e2e3e;
    --accent:#7c6ef7; --accent-dim:#3d3680; --text:#e8e8f0;
    --text-muted:#7878a0; --text-dim:#4a4a68;
    --yadro:#2b2ef5; --yadro-bg:rgba(43,46,245,0.13);
    --iks:#e8e8e8; --iks-bg:rgba(255,255,255,0.08);
    --other:#3a9bdc; --other-bg:rgba(58,155,220,0.13);
    --danger:#e05c6a; --success:#4ecb87;
    --slot-h:56px; --header-h:52px; --tab-h:44px;
    --radius:10px; --font:-apple-system,'SF Pro Display','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-size:14px}

  .header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
  .header-title{font-size:15px;font-weight:600;letter-spacing:-0.2px;flex:1;text-align:center}
  .nav-btn{width:32px;height:32px;border:none;background:var(--surface2);border-radius:8px;color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .nav-btn:active{background:var(--border)}
  .today-btn{height:32px;padding:0 10px;border:none;background:var(--accent-dim);border-radius:8px;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer}
  .admin-btn{width:32px;height:32px;border:none;background:transparent;color:var(--text-muted);font-size:18px;cursor:pointer;flex-shrink:0}

  .view-tabs{height:var(--tab-h);background:var(--surface);display:flex;padding:6px 12px;gap:6px;flex-shrink:0;border-bottom:1px solid var(--border)}
  .view-tab{flex:1;border:none;background:transparent;color:var(--text-muted);font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;transition:all 0.15s}
  .view-tab.active{background:var(--accent);color:#fff;font-weight:600}

  .week-header{display:none;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  .week-header.visible{display:flex}
  .week-header-gutter{width:44px;flex-shrink:0}
  .week-days{display:grid;grid-template-columns:repeat(7,1fr);flex:1}
  .week-day-label{text-align:center;padding:6px 0;font-size:11px;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:2px}
  .week-day-label .wd{font-size:10px;text-transform:uppercase;letter-spacing:0.5px}
  .week-day-label .dd{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
  .week-day-label.today .dd{background:var(--accent);color:#fff}

  .cal-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
  .grid-scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
  .grid-scroll::-webkit-scrollbar{width:3px}
  .grid-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .time-grid{display:flex;min-height:calc(24 * var(--slot-h));position:relative}
  .time-gutter{width:44px;flex-shrink:0;position:relative}
  .time-label{position:absolute;right:8px;font-size:10px;color:var(--text-dim);transform:translateY(-50%);white-space:nowrap}
  .grid-cols{flex:1;position:relative}
  .view-day .grid-cols{display:block}
  .view-week .grid-cols{display:grid;grid-template-columns:repeat(7,1fr)}
  .grid-col{position:relative;border-left:1px solid var(--border)}
  .view-day .grid-col{border-left:none}
  .hour-line{position:absolute;left:0;right:0;border-top:1px solid var(--border);pointer-events:none}
  .hour-line.half{border-top-style:dashed;opacity:0.4}
  .now-line{position:absolute;left:0;right:0;border-top:1.5px solid var(--danger);pointer-events:none;z-index:10}
  .now-line::before{content:'';position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
  .tap-zone{position:absolute;inset:0;z-index:1;cursor:pointer}

  /* Chips */
  .booking-chip{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 5px 3px 7px;font-size:11px;line-height:1.3;overflow:hidden;z-index:5;cursor:pointer;border-left:3px solid;user-select:none;transition:filter 0.15s;display:flex;flex-direction:column;gap:1px}
  .booking-chip:active{filter:brightness(1.2)}
  .booking-chip.team-yadro{background:var(--yadro-bg);border-color:var(--yadro)}
  .booking-chip.team-iks{background:var(--iks-bg);border-color:var(--iks)}
  .booking-chip.team-none{background:var(--other-bg);border-color:var(--other)}
  .chip-row{display:flex;align-items:center;gap:4px;min-width:0}
  .chip-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .chip-tag{font-size:9px;font-weight:700;letter-spacing:0.3px;opacity:0.75;flex-shrink:0;white-space:nowrap}
  .chip-title{font-size:10px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip-time{font-size:10px;color:var(--text-muted)}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.2s}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-height:92dvh;overflow-y:auto;padding:16px;transform:translateY(100%);transition:transform 0.25s cubic-bezier(0.32,0.72,0,1);border-top:1px solid var(--border)}
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
  .modal-title{font-size:17px;font-weight:700;margin-bottom:16px;letter-spacing:-0.3px}

  .time-picker{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
  .time-block{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center;cursor:pointer;transition:border-color 0.15s}
  .time-block-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px}
  .time-block-value{font-size:22px;font-weight:700;letter-spacing:-0.5px}
  .time-arrow{text-align:center;color:var(--text-dim);font-size:18px}
  .duration-label{text-align:center;color:var(--text-muted);font-size:12px;margin-bottom:12px;min-height:16px}

  .time-adjust{display:flex;gap:5px;margin-bottom:16px}
  .adj-btn{flex:1;padding:8px 2px;border:none;background:var(--surface2);border-radius:8px;color:var(--text-muted);font-size:12px;cursor:pointer;text-align:center}
  .adj-btn:active{background:var(--border);color:var(--text)}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
  .field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;padding:10px 12px;outline:none;font-family:var(--font);-webkit-appearance:none;transition:border-color 0.15s}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field input::placeholder{color:var(--text-dim)}

  .modal-actions{display:flex;gap:10px;margin-top:4px}
  .btn{flex:1;padding:13px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font)}
  .btn:active{filter:brightness(1.1)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-secondary{background:var(--surface2);color:var(--text-muted)}
  .btn-danger{background:rgba(224,92,106,0.15);color:var(--danger)}

  .detail-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .detail-row:last-child{border-bottom:none}
  .detail-icon{font-size:16px;width:20px;flex-shrink:0}
  .detail-label{font-size:11px;color:var(--text-muted);margin-bottom:2px}
  .detail-value{font-size:14px}

  /* Team badge */
  .team-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .team-badge.team-yadro{background:var(--yadro-bg);color:#7b7eff;border:1px solid rgba(43,46,245,0.3)}
  .team-badge.team-iks{background:var(--iks-bg);color:#ccc;border:1px solid rgba(255,255,255,0.15)}
  .team-badge.team-none{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
  .team-badge svg{width:14px;height:14px}

  /* Admin */
  .admin-user-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .admin-user-info{flex:1;min-width:0}
  .admin-user-name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
  .admin-user-id{font-size:11px;color:var(--text-muted);margin-top:2px}
  .team-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:4px 6px;outline:none;-webkit-appearance:none;font-family:var(--font)}
  .del-btn{width:30px;height:30px;border:none;background:rgba(224,92,106,0.12);border-radius:7px;color:var(--danger);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .add-user-form{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .add-row{display:flex;gap:8px}
  .add-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;padding:9px 12px;outline:none;font-family:var(--font)}
  .add-row input:focus{border-color:var(--accent)}
  .add-row select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;padding:9px 10px;outline:none;-webkit-appearance:none;font-family:var(--font)}
  .add-row button{padding:9px 14px;border:none;background:var(--accent);border-radius:var(--radius);color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:13px;opacity:0;transition:all 0.25s;z-index:200;white-space:nowrap;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.error{border-color:var(--danger);color:var(--danger)}
  .toast.success{border-color:var(--success);color:var(--success)}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50;flex-direction:column;gap:12px}
  .spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  select option{background:#1a1a22}
</style>
</head>
<body>

<!-- SVG логотипы (скрытые, используются через use) -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="logo-yadro" viewBox="0 0 120 100">
    <!-- Y -->
    <polygon points="0,0 20,0 30,20 40,0 60,0 40,40 40,60 20,60 20,40" fill="currentColor"/>

    <path d="M0,68 L25,68 Q50,68 50,88 Q50,108 25,108 L0,108 Z M18,80 L18,96 L24,96 Q33,96 33,88 Q33,80 24,80 Z" fill="currentColor" transform="scale(1,0.85) translate(0,12)"/>
    <!-- R -->
    <path d="M55,68 L80,68 Q95,68 95,80 Q95,88 86,91 L98,108 L76,108 L67,93 L73,93 Q77,93 77,88 Q77,84 73,84 L73,108 L55,108 Z" fill="currentColor" transform="scale(1,0.85) translate(0,12)"/>

    <circle cx="108" cy="88" r="18" fill="none" stroke="currentColor" stroke-width="9" transform="scale(1,0.85) translate(0,12)"/>

      <rect x="16" y="8" width="8" height="24" rx="2" transform="rotate(45,20,20)"/>
      <rect x="16" y="8" width="8" height="24" rx="2" transform="rotate(90,20,20)"/>
      <rect x="16" y="8" width="8" height="24" rx="2" transform="rotate(135,20,20)"/>
    </g>
    <text x="38" y="28" font-size="20" font-weight="700" font-family="-apple-system,sans-serif" fill="currentColor">ИКС</text>
  </symbol>
</svg>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <span style="color:var(--text-muted);font-size:13px">Загрузка…</span>
</div>

<div class="header">
  <button class="nav-btn" id="prevBtn">‹</button>
  <button class="today-btn" id="todayBtn">Сегодня</button>
  <button class="nav-btn" id="nextBtn">›</button>
  <div class="header-title" id="headerTitle"></div>
  <button class="admin-btn" id="adminBtn" style="display:none">⚙️</button>
</div>

<div class="view-tabs">
  <button class="view-tab active" data-view="day">День</button>
  <button class="view-tab" data-view="week">Неделя</button>
</div>

<div class="week-header" id="weekHeader">
  <div class="week-header-gutter"></div>
  <div class="week-days" id="weekDays"></div>
</div>

<div class="cal-wrap">
  <div class="grid-scroll" id="gridScroll">
    <div class="time-grid view-day" id="timeGrid">
      <div class="time-gutter" id="timeGutter"></div>
      <div class="grid-cols" id="gridCols"></div>
    </div>
  </div>
</div>

<!-- Book modal -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="bookModalTitle">Забронировать</div>
    <div class="time-picker">
      <div class="time-block" id="startBlock" onclick="setActiveField('start')">
        <div class="time-block-label">Начало</div>
        <div class="time-block-value" id="startVal">10:00</div>
      </div>
      <div class="time-arrow">→</div>
      <div class="time-block" id="endBlock" onclick="setActiveField('end')">
        <div class="time-block-label">Конец</div>
        <div class="time-block-value" id="endVal">11:00</div>
      </div>
    </div>
    <div class="duration-label" id="durationLabel"></div>
    <div class="time-adjust">
      <button class="adj-btn" onclick="adjustTime(-60)">−1ч</button>
      <button class="adj-btn" onclick="adjustTime(-30)">−30м</button>
      <button class="adj-btn" onclick="adjustTime(-15)">−15м</button>
      <button class="adj-btn" onclick="adjustTime(15)">+15м</button>
      <button class="adj-btn" onclick="adjustTime(30)">+30м</button>
      <button class="adj-btn" onclick="adjustTime(60)">+1ч</button>
    </div>
    <div class="field">
      <label>Название <span style="color:var(--text-dim);font-weight:400;text-transform:none">(необязательно)</span></label>
      <input type="text" id="fTitle" placeholder="Встреча, звонок…" maxlength="80">
    </div>
    <div class="field">
      <label>Повтор</label>
      <select id="fRecurType">
        <option value="none">Без повтора</option>
        <option value="daily">Ежедневно</option>
        <option value="weekly">Еженедельно</option>
        <option value="monthly">Ежемесячно</option>
      </select>
    </div>
    <div class="field" id="fRecurCountWrap" style="display:none">
      <label>Количество повторений</label>
      <input type="number" id="fRecurCount" min="2" max="365" value="5">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('bookModal')">Отмена</button>
      <button class="btn btn-primary" onclick="saveBooking()">Забронировать</button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Изменить бронь</div>
    <div class="time-picker">
      <div class="time-block" id="eStartBlock" onclick="setActiveEditField('estart')">
        <div class="time-block-label">Начало</div>
        <div class="time-block-value" id="eStartVal">10:00</div>
      </div>
      <div class="time-arrow">→</div>
      <div class="time-block" id="eEndBlock" onclick="setActiveEditField('eend')">
        <div class="time-block-label">Конец</div>
        <div class="time-block-value" id="eEndVal">11:00</div>
      </div>
    </div>
    <div class="duration-label" id="eDurationLabel"></div>
    <div class="time-adjust">
      <button class="adj-btn" onclick="adjustTime(-60,true)">−1ч</button>
      <button class="adj-btn" onclick="adjustTime(-30,true)">−30м</button>
      <button class="adj-btn" onclick="adjustTime(-15,true)">−15м</button>
      <button class="adj-btn" onclick="adjustTime(15,true)">+15м</button>
      <button class="adj-btn" onclick="adjustTime(30,true)">+30м</button>
      <button class="adj-btn" onclick="adjustTime(60,true)">+1ч</button>
    </div>
    <div class="field">
      <label>Название <span style="color:var(--text-dim);font-weight:400;text-transform:none">(необязательно)</span></label>
      <input type="text" id="eTitle" placeholder="Встреча, звонок…" maxlength="80">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('editModal')">Отмена</button>
      <button class="btn btn-primary" onclick="saveEdit()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="detailTitle"></div>
    <div id="detailInfo"></div>
    <div class="modal-actions" id="detailActions"></div>
  </div>
</div>

<!-- Admin modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Управление доступом</div>
    <div id="adminList"><div style="color:var(--text-muted);font-size:13px;padding:10px 0">Загрузка…</div></div>
    <div class="add-user-form">
      <div class="add-row">
        <input type="number" id="newUserId" placeholder="Telegram ID">
        <input type="text" id="newUserName" placeholder="Имя">
      </div>
      <div class="add-row">
        <select id="newUserTeam" style="flex:1">
          <option value="none">Без команды</option>
          <option value="yadro">YADRO</option>
          <option value="iks">ИКС</option>
        </select>
        <button onclick="addUser()">Добавить</button>
      </div>
    </div>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <div class="modal-title" style="font-size:15px;margin-bottom:12px">⚙️ Настройки уведомлений</div>
      <div class="field">
        <label>ID чата для уведомлений</label>
        <input type="text" id="settingChatId" placeholder="-100123456789">
      </div>
      <div class="field">
        <label>Время утреннего расписания</label>
        <input type="time" id="settingTime" value="10:00">
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="saveSettings()">Сохранить настройки</button>
    </div>
    <div class="modal-actions" style="margin-top:12px">
      <button class="btn btn-secondary" onclick="closeModal('adminModal')">Закрыть</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKER_URL = 'https://meet.prok.love';
const ADMIN_IDS = [7075429371];

const tg = window.Telegram?.WebApp;
let currentView = 'day';
let cursor = todayDate();
let bookings = [];
let currentUserId = 0;
let currentUserName = '';
let currentUserTeam = 'none';
let isAdmin = false;
let initDataRaw = '';
let activeField = 'end';
let activeEditField = 'eend';
let editingId = null;
let bookDate = null;
let bStart = {h:10,m:0};
let bEnd = {h:11,m:0};
let eStart = {h:10,m:0};
let eEnd = {h:11,m:0};

// SVG logos as data strings
const LOGOS = {
  yadro: `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,0 L14,0 L22,16 L30,0 L44,0 L30,32 L30,44 L14,44 L14,32 Z" fill="currentColor"/>

(async function init() {
  tg?.expand();
  initDataRaw = tg?.initData || '';
  const user = tg?.initDataUnsafe?.user;
  currentUserId = user?.id || 0;
  currentUserName = user?.first_name || 'Гость';
  if (user?.username) currentUserName += ` (@${user.username})`;

  if (ADMIN_IDS.includes(currentUserId)) {
    document.getElementById('adminBtn').style.display = 'flex';
  }

  await sleep(200);
  document.getElementById('loading').style.display = 'none';

  // Load user's team
  try {
    const me = await apiFetch('/me');
    currentUserTeam = me.team || 'none';
    isAdmin = me.isAdmin || false;
  } catch(e) {}

  render();
  await loadBookings();
  scrollToNow();
  setupListeners();
})();

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  renderHeader();
  renderGrid();
}

function renderHeader() {
  const el = document.getElementById('headerTitle');
  if (currentView === 'day') {
    el.textContent = formatDate(cursor, {weekday:'long',day:'numeric',month:'long'});
  } else {
    const end = addDays(cursor, 6);
    el.textContent = `${cursor.getDate()} — ${end.getDate()} ${end.toLocaleDateString('ru',{month:'long'})}`;
  }
  document.getElementById('weekHeader').classList.toggle('visible', currentView === 'week');
  if (currentView === 'week') renderWeekDayLabels();
}

function renderWeekDayLabels() {
  const c = document.getElementById('weekDays');
  c.innerHTML = '';
  const today = todayDate();
  for (let i=0;i<7;i++) {
    const d = addDays(cursor,i);
    const div = document.createElement('div');
    div.className = 'week-day-label'+(d.toDateString()===today.toDateString()?' today':'');
    div.innerHTML = `<span class="wd">${d.toLocaleDateString('ru',{weekday:'short'})}</span><span class="dd">${d.getDate()}</span>`;
    c.appendChild(div);
  }
}

function renderGrid() {
  document.getElementById('timeGrid').className = `time-grid view-${currentView}`;
  renderGutter();
  renderCols();
  renderNowLine();
}

function renderGutter() {
  const el = document.getElementById('timeGutter');
  el.innerHTML = '';
  for (let h=0;h<=23;h++) {
    const l = document.createElement('div');
    l.className = 'time-label';
    l.style.top = `${h*SLOT_H}px`;
    l.textContent = h===0?'':pad(h)+':00';
    el.appendChild(l);
  }
}

function renderCols() {
  const container = document.getElementById('gridCols');
  container.innerHTML = '';
  const numCols = currentView === 'week' ? 7 : 1;
  for (let c=0;c<numCols;c++) {
    const date = addDays(cursor,c);
    const col = document.createElement('div');
    col.className = 'grid-col';
    col.style.height = `${24*SLOT_H}px`;
    for (let h=0;h<24;h++) {
      const line = document.createElement('div');
      line.className = 'hour-line'; line.style.top = `${h*SLOT_H}px`;
      col.appendChild(line);
      const half = document.createElement('div');
      half.className = 'hour-line half'; half.style.top = `${h*SLOT_H+SLOT_H/2}px`;
      col.appendChild(half);
    }
    const tap = document.createElement('div');
    tap.className = 'tap-zone';
    tap.addEventListener('click', e => handleColTap(e, col, date));
    col.appendChild(tap);
    getBookingsForDate(toDateStr(date)).forEach(b => {
      const chip = createChip(b, numCols>1);
      if (chip) col.appendChild(chip);
    });
    container.appendChild(col);
  }
}

function createChip(b, compact) {
  const sm = timeToMins(b.start.slice(11,16));
  const em = timeToMins(b.end.slice(11,16));
  if (em <= sm) return null;
  const team = b.team || 'none';
  const chip = document.createElement('div');
  chip.className = `booking-chip team-${team}`;
  const heightPx = Math.max(((em-sm)/60)*SLOT_H - 2, 18);
  chip.style.top = `${(sm/60)*SLOT_H}px`;
  chip.style.height = `${heightPx}px`;

  const shortName = b.userName.split(' (@')[0];
  const timeStr = `${b.start.slice(11,16)}–${b.end.slice(11,16)}`;
  const hasTitle = b.title && b.title !== b.userName && b.title !== shortName;
  const teamTag = team !== 'none'
    ? `<span class="chip-tag">${team === 'yadro' ? 'YADRO' : 'ИКС'}</span>`
    : '';

  if (compact) {
    chip.innerHTML = `<div class="chip-row"><span class="chip-name">${esc(shortName)}</span>${teamTag}</div>`;
  } else if (heightPx < 38) {
    const parts = [esc(shortName)];
    if (hasTitle) parts.push(esc(b.title));
    parts.push(timeStr);
    chip.innerHTML = `<div class="chip-row"><span class="chip-name">${parts.join(' · ')}</span>${teamTag}</div>`;
  } else {
    chip.innerHTML = `
      <div class="chip-row"><span class="chip-name">${esc(shortName)}</span>${teamTag}</div>
      ${hasTitle ? `<div class="chip-title">${esc(b.title)}</div>` : ''}
      <div class="chip-time">${timeStr}</div>`;
  }

  chip.addEventListener('click', e => { e.stopPropagation(); openDetail(b); });
  return chip;
}

function renderNowLine() {
  document.querySelectorAll('.now-line').forEach(e=>e.remove());
  const now = new Date();
  const todayStr = toDateStr(now);
  const top = ((now.getHours()*60+now.getMinutes())/60)*SLOT_H;
  if (currentView==='day') {
    if (toDateStr(cursor)!==todayStr) return;
    const col = document.querySelector('.grid-col');
    if (!col) return;
    const line = document.createElement('div');
    line.className='now-line'; line.style.top=top+'px';
    col.appendChild(line);
  } else {
    for (let i=0;i<7;i++) {
      if (toDateStr(addDays(cursor,i))===todayStr) {
        const col = document.querySelectorAll('.grid-col')[i];
        if (!col) break;
        const line = document.createElement('div');
        line.className='now-line'; line.style.top=top+'px';
        col.appendChild(line); break;
      }
    }
  }
}

// ── Time picker ───────────────────────────────────────────────────────────────
function setActiveField(f) {
  activeField = f;
  document.getElementById('startBlock').style.borderColor = f==='start'?'var(--accent)':'';
  document.getElementById('endBlock').style.borderColor = f==='end'?'var(--accent)':'';
}
function setActiveEditField(f) {
  activeEditField = f;
  document.getElementById('eStartBlock').style.borderColor = f==='estart'?'var(--accent)':'';
  document.getElementById('eEndBlock').style.borderColor = f==='eend'?'var(--accent)':'';
}

function adjustTime(delta, isEdit=false) {
  if (!isEdit) {
    if (activeField==='start') {
      const t = bStart.h*60+bStart.m+delta;
      if (t<0||t>=24*60) return;
      bStart = minsToHM(t);
      if (bStart.h*60+bStart.m >= bEnd.h*60+bEnd.m)
        bEnd = minsToHM(Math.min(bStart.h*60+bStart.m+60, 23*60+45));
    } else {
      const t = bEnd.h*60+bEnd.m+delta;
      if (t<=bStart.h*60+bStart.m||t>24*60) return;
      bEnd = minsToHM(Math.min(t,23*60+59));
    }
    updateBookUI();
  } else {
    if (activeEditField==='estart') {
      const t = eStart.h*60+eStart.m+delta;
      if (t<0||t>=24*60) return;
      eStart = minsToHM(t);
      if (eStart.h*60+eStart.m >= eEnd.h*60+eEnd.m)
        eEnd = minsToHM(Math.min(eStart.h*60+eStart.m+60, 23*60+45));
    } else {
      const t = eEnd.h*60+eEnd.m+delta;
      if (t<=eStart.h*60+eStart.m||t>24*60) return;
      eEnd = minsToHM(Math.min(t,23*60+59));
    }
    updateEditUI();
  }
}

function updateBookUI() {
  document.getElementById('startVal').textContent = `${pad(bStart.h)}:${pad(bStart.m)}`;
  document.getElementById('endVal').textContent = `${pad(bEnd.h)}:${pad(bEnd.m)}`;
  document.getElementById('durationLabel').textContent = durStr((bEnd.h*60+bEnd.m)-(bStart.h*60+bStart.m));
}
function updateEditUI() {
  document.getElementById('eStartVal').textContent = `${pad(eStart.h)}:${pad(eStart.m)}`;
  document.getElementById('eEndVal').textContent = `${pad(eEnd.h)}:${pad(eEnd.m)}`;
  document.getElementById('eDurationLabel').textContent = durStr((eEnd.h*60+eEnd.m)-(eStart.h*60+eStart.m));
}
function durStr(mins) {
  if (mins<=0) return '';
  const h=Math.floor(mins/60),m=mins%60;
  return h>0?(m>0?`${h} ч ${m} мин`:`${h} ч`):`${m} мин`;
}

// ── Tap ───────────────────────────────────────────────────────────────────────
function handleColTap(e, col, date) {
  const rect = col.getBoundingClientRect();
  const totalMins = Math.round(((e.clientY-rect.top)/SLOT_H*60)/15)*15;
  bookDate = date;
  bStart = minsToHM(totalMins);
  bEnd = minsToHM(Math.min(totalMins+60, 23*60+45));
  activeField = 'end';
  document.getElementById('bookModalTitle').textContent = formatDate(date,{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('fTitle').value = '';
  document.getElementById('fRecurType').value = 'none';
  document.getElementById('fRecurCountWrap').style.display = 'none';
  setActiveField('end');
  updateBookUI();
  openModal('bookModal');
}

// ── Save ──────────────────────────────────────────────────────────────────────
async function saveBooking() {
  const dateStr = toDateStr(bookDate);
  const body = {
    title: document.getElementById('fTitle').value.trim(),
    start: `${dateStr}T${pad(bStart.h)}:${pad(bStart.m)}:00`,
    end: `${dateStr}T${pad(bEnd.h)}:${pad(bEnd.m)}:00`,
  };
  const recurType = document.getElementById('fRecurType').value;
  if (recurType !== 'none') body.recurrence = {type:recurType, count:parseInt(document.getElementById('fRecurCount').value)||1};
  try {
    const result = await apiFetch('/bookings','POST',body);
    if (result.conflict) {
      closeModal('bookModal');
      toast('⏳ Время занято — запрос отправлен владельцу', '');
    } else {
      bookings = [...bookings,...result];
      closeModal('bookModal');
      renderCols();
      toast(result.length>1?`Создано ${result.length} броней`:'Забронировано ✓','success');
    }
  } catch(e) { toast(e.message||'Ошибка','error'); }
}

// ── Detail ────────────────────────────────────────────────────────────────────
function openDetail(b) {
  const shortName = b.userName.split(' (@')[0];
  const hasTitle = b.title && b.title !== b.userName && b.title !== shortName;
  document.getElementById('detailTitle').textContent = hasTitle ? b.title : shortName;

  const startDt = new Date(b.start);
  const dateStr = startDt.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'});
  const timeStr = `${b.start.slice(11,16)} — ${b.end.slice(11,16)}`;
  const dur = (new Date(b.end)-new Date(b.start))/60000;

  document.getElementById('detailInfo').innerHTML = `
    <div class="detail-row"><div class="detail-icon">📅</div><div><div class="detail-label">Дата</div><div class="detail-value">${dateStr}</div></div></div>
    <div class="detail-row"><div class="detail-icon">🕐</div><div><div class="detail-label">Время</div><div class="detail-value">${timeStr} · ${durStr(dur)}</div></div></div>
    <div class="detail-row"><div class="detail-icon">👤</div><div><div class="detail-label">Кто</div><div class="detail-value" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${esc(b.userName)} ${teamBadgeHTML(b.team||'none')}</div></div></div>
  `;

  const actions = document.getElementById('detailActions');
  if (b.userId === currentUserId || isAdmin) {
    actions.innerHTML = '';
    const cancelBtn = document.createElement('button');
    cancelBtn.className='btn btn-secondary'; cancelBtn.textContent='Закрыть';
    cancelBtn.onclick = ()=>closeModal('detailModal');
    const editBtn = document.createElement('button');
    editBtn.className='btn btn-primary'; editBtn.textContent='Изменить';
    editBtn.onclick = ()=>{ closeModal('detailModal'); openEditModal(b); };
    const delBtn = document.createElement('button');
    delBtn.className='btn btn-danger'; delBtn.style.flex='0 0 auto'; delBtn.textContent='🗑';
    delBtn.onclick = ()=>confirmDelete(b);
    actions.appendChild(cancelBtn); actions.appendChild(editBtn); actions.appendChild(delBtn);
  } else {
    actions.innerHTML = `<button class="btn btn-secondary" style="flex:1" onclick="closeModal('detailModal')">Закрыть</button>`;
  }
  openModal('detailModal');
}

function openEditModal(b) {
  editingId = b.id;
  eStart = {h:parseInt(b.start.slice(11,13)),m:parseInt(b.start.slice(14,16))};
  eEnd = {h:parseInt(b.end.slice(11,13)),m:parseInt(b.end.slice(14,16))};
  document.getElementById('eTitle').value = b.title || '';
  activeEditField = 'eend';
  setActiveEditField('eend');
  updateEditUI();
  openModal('editModal');
}

async function saveEdit() {
  const b = bookings.find(x=>x.id===editingId);
  if (!b) return;
  const dateStr = b.start.slice(0,10);
  try {
    const updated = await apiFetch(`/bookings/${editingId}`,'PUT',{
      title: document.getElementById('eTitle').value.trim() || null,
      start:`${dateStr}T${pad(eStart.h)}:${pad(eStart.m)}:00`,
      end:`${dateStr}T${pad(eEnd.h)}:${pad(eEnd.m)}:00`
    });
    bookings = bookings.map(x=>x.id===editingId?updated:x);
    closeModal('editModal'); renderCols();
    toast('Обновлено','success');
  } catch(e) { toast(e.message||'Ошибка','error'); }
}

async function confirmDelete(b) {
  if (!confirm(`Удалить бронь ${b.start.slice(11,16)}–${b.end.slice(11,16)}?`)) return;
  try {
    await apiFetch(`/bookings/${b.id}`,'DELETE');
    bookings = bookings.filter(x=>x.id!==b.id);
    closeModal('detailModal'); renderCols();
    toast('Бронь удалена','success');
  } catch(e) { toast(e.message||'Ошибка','error'); }
}

// ── Admin ─────────────────────────────────────────────────────────────────────
async function openAdmin() {
  openModal('adminModal');
  await loadAdminUsers();
  await loadSettings();
}

async function loadSettings() {
  try {
    const s = await apiFetch('/admin/settings');
    if (s.notify_chat_id) document.getElementById('settingChatId').value = s.notify_chat_id;
    if (s.notify_time) document.getElementById('settingTime').value = s.notify_time;
  } catch(e) {}
}

async function saveSettings() {
  const chat_id = document.getElementById('settingChatId').value.trim();
  const notify_time = document.getElementById('settingTime').value;
  try {
    await apiFetch('/admin/settings', 'POST', {
      notify_chat_id: chat_id || null,
      notify_time: notify_time || null
    });
    toast('Настройки сохранены ✓', 'success');
  } catch(e) { toast(e.message||'Ошибка', 'error'); }
}

async function loadAdminUsers() {
  const list = document.getElementById('adminList');
  try {
    const users = await apiFetch('/admin/users');
    if (!users.length) { list.innerHTML='<div style="color:var(--text-muted);font-size:13px;padding:10px 0">Список пуст</div>'; return; }
    list.innerHTML = users.map(u => `
      <div class="admin-user-row" id="urow-${u.id}">
        <div class="admin-user-info">
          <div class="admin-user-name" onclick="editUserName(${u.id},'${esc(u.name||'')}')" style="cursor:pointer" title="Нажми чтобы изменить имя">${esc(u.name||'—')} ✏️</div>
          <div class="admin-user-id">ID: ${u.id}</div>
        </div>
        <select class="team-select" onchange="updateTeam(${u.id},this.value)">
          <option value="none"${u.team==='none'?' selected':''}>—</option>
          <option value="yadro"${u.team==='yadro'?' selected':''}>YADRO</option>
          <option value="iks"${u.team==='iks'?' selected':''}>ИКС</option>
        </select>
        <button class="del-btn" onclick="removeUser(${u.id})">✕</button>
      </div>
    `).join('');
  } catch(e) { list.innerHTML='<div style="color:var(--danger);font-size:13px">Ошибка</div>'; }
}

async function updateTeam(tgId, team) {
  try {
    await apiFetch(`/admin/users/${tgId}`,'PATCH',{team});
    if (tgId === currentUserId) currentUserTeam = team;
    toast('Команда обновлена','success');
  } catch(e) { toast(e.message||'Ошибка','error'); }
}

async function addUser() {
  const id = parseInt(document.getElementById('newUserId').value);
  const name = document.getElementById('newUserName').value.trim();
  const team = document.getElementById('newUserTeam').value;
  if (!id) { toast('Введите Telegram ID','error'); return; }
  try {
    await apiFetch('/admin/users','POST',{id,name,team});
    document.getElementById('newUserId').value='';
    document.getElementById('newUserName').value='';
    document.getElementById('newUserTeam').value='none';
    await loadAdminUsers();
    toast('Пользователь добавлен','success');
  } catch(e) { toast(e.message||'Ошибка','error'); }
}

async function editUserName(tgId, currentName) {
  const name = prompt('Имя пользователя:', currentName);
  if (name === null) return;
  try {
    await apiFetch(`/admin/users/${tgId}`, 'PATCH', {name: name.trim()});
    await loadAdminUsers();
    toast('Имя обновлено', 'success');
  } catch(e) { toast(e.message||'Ошибка', 'error'); }
}

async function removeUser(tgId) {
  if (!confirm('Удалить пользователя?')) return;
  try {
    await apiFetch(`/admin/users/${tgId}`,'DELETE');
    await loadAdminUsers();
    toast('Удалён','success');
  } catch(e) { toast(e.message||'Ошибка','error'); }
}

// ── Data ──────────────────────────────────────────────────────────────────────
async function loadBookings() {
  const from = toDateStr(addDays(cursor,-30));
  const to = toDateStr(addDays(cursor,37));
  try {
    bookings = await apiFetch(`/bookings?from=${from}&to=${to}`);
    renderCols(); renderNowLine();
  } catch(e) { toast('Ошибка загрузки','error'); }
}

function getBookingsForDate(ds) { return bookings.filter(b=>b.start.startsWith(ds)); }

// ── Nav ───────────────────────────────────────────────────────────────────────
function navigate(dir) { cursor=addDays(cursor,currentView==='day'?dir:dir*7); render(); loadBookings(); }
function goToday() { cursor=todayDate(); render(); loadBookings(); scrollToNow(); }
function scrollToNow() {
  const now=new Date();
  document.getElementById('gridScroll').scrollTo({top:Math.max(((now.getHours()*60+now.getMinutes())/60)*SLOT_H-80,0),behavior:'smooth'});
}

function setupListeners() {
  document.getElementById('prevBtn').addEventListener('click',()=>navigate(-1));
  document.getElementById('nextBtn').addEventListener('click',()=>navigate(1));
  document.getElementById('todayBtn').addEventListener('click',goToday);
  document.getElementById('adminBtn').addEventListener('click',openAdmin);
  document.querySelectorAll('.view-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentView=btn.dataset.view;
      if (currentView==='week') { const d=cursor.getDay(); cursor=addDays(cursor,d===0?-6:1-d); }
      render(); loadBookings();
    });
  });
  document.getElementById('fRecurType').addEventListener('change',e=>{
    document.getElementById('fRecurCountWrap').style.display=e.target.value==='none'?'none':'block';
  });
  ['bookModal','editModal','detailModal','adminModal'].forEach(id=>{
    document.getElementById(id).addEventListener('click',e=>{ if(e.target.id===id) closeModal(id); });
  });
  setInterval(()=>renderNowLine(),60000);
}

function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}

async function apiFetch(path,method='GET',body=null) {
  const opts={method,headers:{'Content-Type':'application/json','X-Init-Data':initDataRaw}};
  if(body) opts.body=JSON.stringify(body);
  const res=await fetch(WORKER_URL+path,opts);
  const data=await res.json();
  if(!res.ok) throw new Error(data.detail||data.error||'Ошибка сервера');
  return data;
}

let toastTimer;
function toast(msg,type='') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show'+(type?' '+type:'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function todayDate(){const d=new Date();d.setHours(0,0,0,0);return d}
function toDateStr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function pad(n){return String(n).padStart(2,'0')}
function timeToMins(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function minsToHM(t){return{h:Math.floor(t/60),m:t%60}}
function formatDate(d,opts){return d.toLocaleDateString('ru',opts)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
